name: CI Check

on:
  push:
    branches: [develop, main, master]
  pull_request:
    branches: [develop]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        # Exclude rules:
        # SC1078 - here-doc warnings in nginx config generation (standard style)
        # SC1090 - dynamic source/load() pattern, ShellCheck can't resolve
        # SC2034 - vars appear unused but are dynamically sourced by load()
        # SC2046 - unquoted command substitution in heredocs/cat is standard style
        # SC2062 - unquoted grep patterns are standard project style
        # SC2068 - project uses $@ without quoting as standard pattern
        # SC2140 - unquoted text in echo/cat (standard project style)
        # SC2145 - same as SC2068, array/string mixing in $@ usage
        # SC2154 - dynamically sourced vars from load()
        # SC2155 - project uses 'local var=$(cmd)' as a standard pattern
        # SC2317 - helper functions appear unreachable but are called indirectly
        run: |
          echo "=== Checking install.sh ==="
          shellcheck --severity=warning --exclude=SC1078,SC1090,SC2034,SC2046,SC2062,SC2068,SC2140,SC2145,SC2154,SC2155,SC2317 install.sh

          echo "=== Checking xray.sh ==="
          shellcheck --severity=warning --exclude=SC1078,SC1090,SC2034,SC2046,SC2062,SC2068,SC2140,SC2145,SC2154,SC2155,SC2317 xray.sh

          echo "=== Checking src/*.sh (excluding core.sh) ==="
          for f in src/*.sh; do
            [[ "$f" == "src/core.sh" ]] && continue
            echo "Checking $f..."
            shellcheck --severity=warning --exclude=SC1078,SC1090,SC2034,SC2046,SC2062,SC2068,SC2140,SC2145,SC2154,SC2155,SC2317 "$f"
          done

          echo "=== Checking src/core.sh (large file, 120s timeout) ==="
          # SC2155 excluded: core.sh uses 'local var=$(cmd)' extensively (2340 lines)
          # Splitting all instances would be a massive behavioral change
          timeout 120 shellcheck --severity=warning --exclude=SC1078,SC1090,SC2034,SC2046,SC2062,SC2068,SC2086,SC2140,SC2145,SC2154,SC2155,SC2317 src/core.sh || {
            if [[ $? -eq 124 ]]; then
              echo "⚠️ ShellCheck timeout on src/core.sh (2340 lines, too complex)"
            else
              exit 1
            fi
          }

          echo "✅ All ShellCheck checks passed"

  bash-syntax:
    name: Bash Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check bash syntax
        run: |
          echo "=== Checking install.sh ==="
          bash -n install.sh

          echo "=== Checking xray.sh ==="
          bash -n xray.sh

          echo "=== Checking src/*.sh ==="
          for f in src/*.sh; do
            echo "Checking $f..."
            bash -n "$f"
          done

          echo "✅ All bash syntax checks passed"

  json-validation:
    name: JSON Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Validate JSON files
        run: |
          echo "=== Validating JSON files ==="
          find . -name "*.json" -not -path "./.git/*" | while read -r f; do
            echo "Validating $f..."
            jq . "$f" > /dev/null 2>&1 || {
              echo "❌ Invalid JSON: $f"
              jq . "$f"
              exit 1
            }
          done
          echo "✅ All JSON files valid"

  naming-consistency:
    name: Naming Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for V2Ray remnants
        run: |
          echo "=== Checking for V2Ray/v2ray remnants ==="
          # Allow legitimate contexts: old_backup, Loyalsoldier, tree/old, v2ray-rules-dat,
          # old migration paths (src/old.sh, /etc/v2ray/, v2ray_*, _v2ray_*)
          RESULTS=$(grep -rn 'V2Ray\|v2ray' src/ install.sh xray.sh \
            --include="*.sh" 2>/dev/null | grep -v 'old_backup\|Loyalsoldier\|tree/old\|v2ray-rules-dat\|src/old\.sh\|src/init\.sh\|/etc/v2ray/\|v2ray_\|_v2ray_\|233blog_v2ray' || true)

          if [[ -n "$RESULTS" ]]; then
            echo "❌ Found V2Ray/v2ray remnants:"
            echo "$RESULTS"
            exit 1
          fi

          echo "✅ No V2Ray/v2ray remnants found (except legitimate contexts)"

  protocol-completeness:
    name: Protocol Completeness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check protocol list
        run: |
          echo "=== Checking protocol completeness ==="
          MISSING=0

          for proto in \
            "VLESS-XTLS-uTLS-REALITY" \
            "VLESS-XHTTP-TLS" \
            "Trojan-XHTTP-TLS" \
            "VMess-WS-TLS" \
            "VLESS-WS-TLS" \
            "Trojan-WS-TLS" \
            "Shadowsocks" \
            "VMess-TCP"; do
            if grep -q "$proto" src/core.sh; then
              echo "✅ $proto found"
            else
              echo "❌ $proto MISSING"
              MISSING=$((MISSING + 1))
            fi
          done

          if [[ $MISSING -gt 0 ]]; then
            echo "❌ $MISSING protocols missing from protocol_list"
            exit 1
          fi

          echo "✅ All required protocols present"
