name: CI Check

on:
  push:
    branches: [develop, main, master]
  pull_request:
    branches: [develop, main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        # ShellCheck rules and core.sh chunking are maintained in tests/shellcheck.sh.
        run: bash tests/shellcheck.sh

  shell-syntax:
    name: Shell Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check bash syntax
        run: |
          echo "=== Checking install.sh ==="
          bash -n install.sh

          echo "=== Checking test harness ==="
          bash -n tests/run.sh
          bash -n tests/shellcheck.sh

          echo "✅ Retained shell syntax checks passed"

  automated-tests:
    name: Automated Testcases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run scripted testcases
        run: bash tests/run.sh

  json-validation:
    name: JSON Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Validate JSON files
        run: |
          echo "=== Validating JSON files ==="
          find . -name "*.json" -not -path "./.git/*" | while read -r f; do
            echo "Validating $f..."
            jq . "$f" > /dev/null 2>&1 || {
              echo "❌ Invalid JSON: $f"
              jq . "$f"
              exit 1
            }
          done
          echo "✅ All JSON files valid"

  naming-consistency:
    name: Naming Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for V2Ray remnants
        run: |
          echo "=== Checking for V2Ray/v2ray remnants ==="
          RESULTS=$(grep -rn 'V2Ray\|v2ray' install.sh internal cmd \
            --include="*.sh" --include="*.go" 2>/dev/null | grep -v 'Loyalsoldier\|v2ray-rules-dat' || true)

          if [[ -n "$RESULTS" ]]; then
            echo "❌ Found V2Ray/v2ray remnants:"
            echo "$RESULTS"
            exit 1
          fi

          echo "✅ No V2Ray/v2ray remnants found (except legitimate contexts)"

  protocol-completeness:
    name: Protocol Completeness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check protocol list
        run: |
          echo "=== Checking protocol completeness ==="
          MISSING=0

          for proto in \
            "VLESS-XTLS-uTLS-REALITY" \
            "VLESS-XHTTP-TLS" \
            "Trojan-XHTTP-TLS" \
            "VMess-WS-TLS" \
            "VLESS-WS-TLS" \
            "Trojan-WS-TLS" \
            "Shadowsocks" \
            "VMess-TCP"; do
            if grep -q "$proto" internal/protocol/profile.go; then
              echo "✅ $proto found"
            else
              echo "❌ $proto MISSING"
              MISSING=$((MISSING + 1))
            fi
          done

          if [[ $MISSING -gt 0 ]]; then
            echo "❌ $MISSING protocols missing from protocol_list"
            exit 1
          fi

          echo "✅ All required protocols present"
